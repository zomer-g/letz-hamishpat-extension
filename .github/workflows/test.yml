name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jsdom-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chrome/package-lock.json
      - run: npm ci
      - run: npm test
